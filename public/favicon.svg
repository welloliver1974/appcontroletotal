<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Dark com Gradiente Sutil -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="60%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#040405" />
    </radialGradient>

    <!-- Aura de Energia Externa -->
    <radialGradient id="outerAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#09090b" stop-opacity="0" />
    </radialGradient>

    <!-- Núcleo da Esfera Neural -->
    <radialGradient id="orbCore" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="15%" stop-color="#e0e7ff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#a855f7" stop-opacity="0.85" />
      <stop offset="65%" stop-color="#6366f1" stop-opacity="0.75" />
      <stop offset="90%" stop-color="#1e1b4b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Brilho Interno dos Filamentos -->
    <linearGradient id="neuralGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Anel de Giroscópio 1 -->
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>

    <!-- Anel de Giroscópio 2 -->
    <linearGradient id="ringGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filtros de Brilho / Glow -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="22" result="blur" />
    </filter>
  </defs>

  <!-- 1. Fundo Seguro (PWA Maskable Compliant) -->
  <rect width="512" height="512" fill="url(#bgGlow)" />

  <!-- 2. Aura e Atmosfera Bioluminescente -->
  <circle cx="256" cy="256" r="220" fill="url(#outerAura)" filter="url(#softGlow)" />
  <circle cx="256" cy="256" r="175" fill="url(#outerAura)" />

  <!-- 3. Anel Orbital Externo (Giroscópio Tecnológico) -->
  <g transform="rotate(-28 256 256)">
    <ellipse cx="256" cy="256" rx="180" ry="62" fill="none" stroke="url(#ringGrad1)" stroke-width="2.5" stroke-dasharray="14 6 4 6" opacity="0.75" />
    <circle cx="436" cy="256" r="4" fill="#38bdf8" filter="url(#bloom)" />
    <circle cx="76" cy="256" r="3" fill="#a855f7" filter="url(#bloom)" />
  </g>

  <!-- 4. Anel Orbital Cruzado -->
  <g transform="rotate(38 256 256)">
    <ellipse cx="256" cy="256" rx="170" ry="54" fill="none" stroke="url(#ringGrad2)" stroke-width="2" opacity="0.65" />
    <circle cx="426" cy="256" r="3.5" fill="#c084fc" filter="url(#bloom)" />
  </g>

  <!-- 5. O Esferóide / Neural Core Principal -->
  <circle cx="256" cy="256" r="132" fill="url(#orbCore)" filter="url(#bloom)" />

  <!-- 6. Malha Sináptica e Filamentos Neurais Conectados -->
  <!-- Conexões Curvas com Gradiente -->
  <g stroke="url(#neuralGlow)" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M 256 160 C 230 190, 205 220, 256 256 C 290 280, 320 310, 256 352" />
    <path d="M 160 256 C 190 230, 220 205, 256 256 C 280 290, 310 320, 352 256" />
    <path d="M 185 185 C 225 215, 240 230, 256 256 C 275 285, 305 315, 327 327" />
    <path d="M 327 185 C 295 215, 275 235, 256 256 C 235 280, 205 305, 185 327" />
    <path d="M 210 170 Q 256 210 302 170" />
    <path d="M 210 342 Q 256 302 302 342" />
    <path d="M 170 210 Q 210 256 170 302" />
    <path d="M 342 210 Q 302 256 342 302" />
  </g>

  <!-- 7. Nós Sinápticos / Pulso de Energia da IA -->
  <g fill="#ffffff" filter="url(#bloom)">
    <!-- Núcleo Central Primário -->
    <circle cx="256" cy="256" r="9" fill="#ffffff" />
    <circle cx="256" cy="256" r="16" fill="#c084fc" opacity="0.55" />

    <!-- Nós da Constelação Neural -->
    <circle cx="256" cy="160" r="4.5" fill="#38bdf8" />
    <circle cx="256" cy="352" r="4.5" fill="#a855f7" />
    <circle cx="160" cy="256" r="4.5" fill="#38bdf8" />
    <circle cx="352" cy="256" r="4.5" fill="#f472b6" />

    <circle cx="185" cy="185" r="4" fill="#c084fc" />
    <circle cx="327" cy="185" r="4" fill="#38bdf8" />
    <circle cx="185" cy="327" r="4" fill="#a855f7" />
    <circle cx="327" cy="327" r="4.5" fill="#f472b6" />

    <circle cx="210" cy="220" r="3.5" fill="#ffffff" />
    <circle cx="302" cy="220" r="3.5" fill="#ffffff" />
    <circle cx="210" cy="292" r="3.5" fill="#ffffff" />
    <circle cx="302" cy="292" r="3.5" fill="#ffffff" />
  </g>

  <!-- 8. Brilho Especular Superior (Reflexo de Lente / Vidro Curvo) -->
  <path d="M 175 185 C 200 145, 312 145, 337 185 C 300 170, 212 170, 175 185 Z" fill="#ffffff" opacity="0.38" filter="url(#bloom)" />
  <ellipse cx="235" cy="165" rx="38" ry="14" fill="#ffffff" opacity="0.22" transform="rotate(-15 235 165)" />

  <!-- 9. Partículas Estelares Flutuantes -->
  <circle cx="128" cy="148" r="1.8" fill="#38bdf8" opacity="0.75" />
  <circle cx="384" cy="138" r="2.2" fill="#c084fc" opacity="0.8" />
  <circle cx="118" cy="360" r="1.8" fill="#a855f7" opacity="0.65" />
  <circle cx="396" cy="368" r="2" fill="#38bdf8" opacity="0.7" />
  <circle cx="256" cy="92" r="1.5" fill="#ffffff" opacity="0.8" />
  <circle cx="256" cy="420" r="1.5" fill="#c084fc" opacity="0.6" />
</svg>